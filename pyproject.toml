[project]
name = "task-manager"
version = "0.1.0"
description = "Demo Task Manager API for webinar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "aiosqlite>=0.22.1",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.15.1",
    "pyright>=1.1.400",
    "pre-commit>=4.5.1",
    "factory-boy>=3.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["UP046", "SIM108"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["migrations", ".venv", "tests"]
reportDeprecated = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
